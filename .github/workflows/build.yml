name: Build SKYLINE APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR size: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Create font placeholder files
        run: |
          mkdir -p app/src/main/res/font
          SYSFONT=$(find /usr/share/fonts -name "*.ttf" | head -1)
          for f in orbitron_regular orbitron_medium orbitron_semibold orbitron_bold \
                   orbitron_extrabold orbitron_black \
                   rajdhani_regular rajdhani_medium rajdhani_semibold rajdhani_bold; do
            cp "$SYSFONT" "app/src/main/res/font/${f}.ttf"
          done
          echo "Fonts: $(ls app/src/main/res/font/ | wc -l) files"

      - name: Create drawable and launcher resources
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-${d}"
          done

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:width="108dp" android:height="108dp"' \
            '    android:viewportWidth="108" android:viewportHeight="108">' \
            '  <path android:fillColor="#FF4DB8"' \
            '      android:pathData="M36,22L36,86M36,86L58,86M36,54L54,54"/>' \
            '</vector>' \
            > app/src/main/res/drawable/ic_launcher_foreground.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <solid android:color="#0F0A17"/>' \
            '</shape>' \
            > app/src/main/res/drawable/ic_launcher_background.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@drawable/ic_launcher_background"/>' \
            '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          python3 - << 'PYEOF'
          import struct, zlib, os

          def make_png(size, bg=(15,10,23), fg=(255,77,184)):
              def chunk(tag, data):
                  c = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', c)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 2, 0, 0, 0)
              rows = []
              for y in range(size):
                  row = b'\x00'
                  for x in range(size):
                      lx = size // 3
                      by = size * 4 // 5
                      if x == lx and size // 5 <= y <= by:
                          row += bytes(fg)
                      elif y == by and lx <= x <= size * 3 // 5:
                          row += bytes(fg)
                      else:
                          row += bytes(bg)
                  rows.append(row)
              raw = b''.join(rows)
              idat = zlib.compress(raw)
              return (b'\x89PNG\r\n\x1a\n'
                      + chunk(b'IHDR', ihdr)
                      + chunk(b'IDAT', idat)
                      + chunk(b'IEND', b''))

          sizes = {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for density, sz in sizes.items():
              png = make_png(sz)
              base = f'app/src/main/res/mipmap-{density}'
              open(f'{base}/ic_launcher.png','wb').write(png)
              open(f'{base}/ic_launcher_round.png','wb').write(png)
              print(f'{density}: {sz}x{sz} OK')
          PYEOF
          echo "Resources OK"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SkylineControlCenter-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SkylineControlCenter-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
