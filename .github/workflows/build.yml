name: Build SKYLINE APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download gradle-wrapper.jar
        run: |
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.10.2/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "JAR size: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Create font placeholder files
        run: |
          mkdir -p app/src/main/res/font
          SYSFONT=$(find /usr/share/fonts -name "*.ttf" | head -1)
          for f in orbitron_regular orbitron_medium orbitron_semibold orbitron_bold \
                   orbitron_extrabold orbitron_black \
                   rajdhani_regular rajdhani_medium rajdhani_semibold rajdhani_bold; do
            cp "$SYSFONT" "app/src/main/res/font/${f}.ttf"
          done
          echo "Fonts: $(ls app/src/main/res/font/ | wc -l) files"

      - name: Create drawable and launcher resources
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "app/src/main/res/mipmap-${d}"
          done

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<vector xmlns:android="http://schemas.android.com/apk/res/android"' \
            '    android:width="108dp" android:height="108dp"' \
            '    android:viewportWidth="108" android:viewportHeight="108">' \
            '  <path android:fillColor="#FF4DB8"' \
            '      android:pathData="M36,22L36,86M36,86L58,86M36,54L54,54"/>' \
            '</vector>' \
            > app/src/main/res/drawable/ic_launcher_foreground.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<shape xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <solid android:color="#0F0A17"/>' \
            '</shape>' \
            > app/src/main/res/drawable/ic_launcher_background.xml

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <background android:drawable="@drawable/ic_launcher_background"/>' \
            '    <foreground android:drawable="@drawable/ic_launcher_foreground"/>' \
            '</adaptive-icon>' \
            > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            case $density in
              mdpi)    size=48  ;;
              hdpi)    size=72  ;;
              xhdpi)   size=96  ;;
              xxhdpi)  size=144 ;;
              xxxhdpi) size=192 ;;
            esac
            convert -size ${size}x${size} xc:'#0F0A17' \
              -fill '#FF4DB8' \
              -draw "line $((size/3)),$((size/5)) $((size/3)),$((size*4/5))" \
              -draw "line $((size/3)),$((size*4/5)) $((size*3/5)),$((size*4/5))" \
              "app/src/main/res/mipmap-${density}/ic_launcher.png"
            cp "app/src/main/res/mipmap-${density}/ic_launcher.png" \
               "app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done
          echo "Resources OK"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SkylineControlCenter-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SkylineControlCenter-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
